version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelid-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sentinelid.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - UPLOAD_DIR=./uploads
      - OCR_ENGINE=tesseract
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/sentinelid.db:/app/sentinelid.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelid-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: sentinelid-network
